<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 精细角色 — 美团员工</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: #FAF8F2;
    color: #3a362e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 700;
    color: #2f2c25;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .page-subtitle {
    font-size: 14px;
    color: #8a8578;
    margin-bottom: 36px;
    letter-spacing: 0.5px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    max-width: 680px;
    width: 100%;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(47,44,37,0.06);
    padding: 24px 12px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(47,44,37,0.12); }
  .card svg { width: 120px; height: 160px; display: block; }
  .card-label {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #2f2c25;
    letter-spacing: 1px;
  }
  .card-desc {
    margin-top: 4px;
    font-size: 11px;
    color: #a09a90;
  }
  .back-link {
    margin-top: 40px;
    font-size: 13px;
    color: #8a8578;
    text-decoration: none;
    border-bottom: 1px dashed #c5c0b6;
    transition: color 0.2s;
  }
  .back-link:hover { color: #2f2c25; }

  /* ---- Animations ---- */
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.025); }
  }
  @keyframes breathe-alert {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.045); }
  }
  .anim-breathe {
    animation: breathe 2.8s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .anim-breathe-alert {
    animation: breathe-alert 1s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
  .speech-dot { animation: dot-pulse 1.4s ease-in-out infinite; }
  .speech-dot:nth-child(2) { animation-delay: 0.2s; }
  .speech-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-1.5px); }
    40% { transform: translateX(1.5px); }
    60% { transform: translateX(-1px); }
    80% { transform: translateX(1px); }
  }
  .anim-shake {
    animation: shake 0.6s ease-in-out infinite;
  }
  @keyframes check-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .anim-check {
    animation: check-pop 0.6s ease-out forwards;
    transform-origin: center;
  }
  @keyframes arm-thumbsup {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-18deg); }
    70% { transform: rotate(-18deg); }
  }
  .anim-arm-up {
    animation: arm-thumbsup 2.5s ease-in-out infinite;
    transform-origin: 72px 84px;
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
  .anim-glow { animation: glow-pulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>

<div class="page-title">SVG 精细角色</div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等轴测伪 3D - 美团骑手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #FAF8F2;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #2f2c25;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

.page-header {
  text-align: center;
  margin-bottom: 48px;
}

.page-header h1 {
  font-size: 28px;
  font-weight: 700;
  color: #2f2c25;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.page-header p {
  font-size: 14px;
  color: #888;
}

.states-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  max-width: 800px;
  width: 100%;
}

.state-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.state-label {
  font-size: 15px;
  font-weight: 600;
  color: #2f2c25;
  background: #fff;
  padding: 4px 16px;
  border-radius: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.state-sublabel {
  font-size: 11px;
  color: #aaa;
}

/* ============================================
   ISOMETRIC SCENE
   ============================================ */

.iso-scene {
  width: 160px;
  height: 160px;
  perspective: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.iso-worker {
  position: relative;
  width: 50px;
  height: 80px;
  transform-style: preserve-3d;
  transform: rotateX(60deg) rotateZ(-45deg);
  transform-origin: center center;
}

/* --- BASE --- */
.iso-base {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 52px;
  background: #e8e4dc;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(0,0,0,0.15);
}

.iso-base::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 6px;
  width: 52px;
  height: 52px;
  background: #d4cfc6;
  border-radius: 4px;
  transform: skewX(-45deg);
  transform-origin: bottom left;
}

.iso-base::after {
  content: '';
  position: absolute;
  top: -6px;
  right: -6px;
  width: 6px;
  height: 52px;
  background: #c8c2b8;
  transform: skewY(-45deg);
  transform-origin: top left;
}

/* --- BODY --- */
.iso-body {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 34px;
  height: 36px;
}

.iso-body-front {
  position: absolute;
  width: 34px;
  height: 36px;
  background: #2f2c25;
  border-radius: 2px 2px 0 0;
}

.iso-body-front::before {
  content: '';
  position: absolute;
  top: 0;
  right: -6px;
  width: 6px;
  height: 36px;
  background: #1a1a18;
  transform: skewY(-45deg);
  transform-origin: top left;
}

.iso-body-front::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 6px;
  width: 34px;
  height: 6px;
  background: #3a3a35;
  transform: skewX(-45deg);
  transform-origin: bottom left;
}

/* Badge on front */
.iso-badge {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 10px;
  background: #fff8d5;
  border-radius: 1px;
}

/* --- FACE --- */
.iso-face {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 14px;
  background: #f4be72;
  border-radius: 2px;
  z-index: 2;
}

.iso-face::before {
  content: '';
  position: absolute;
  top: 6px;
  left: 3px;
  width: 3px;
  height: 2px;
  background: #2f2c25;
  border-radius: 1px;
  box-shadow: 11px 0 0 #2f2c25;
}

.iso-face::after {
  content: '';
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 2px;
  border-bottom: 1.5px solid #d4945a;
  border-radius: 0 0 3px 3px;
}

/* --- HELMET --- */
.iso-helmet {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 18px;
}

.iso-helmet-front {
  position: absolute;
  width: 30px;
  height: 18px;
  background: #FFD333;
  border-radius: 4px 4px 0 0;
  z-index: 1;
}

.iso-helmet-front::before {
  content: '';
  position: absolute;
  top: 0;
  right: -6px;
  width: 6px;
  height: 18px;
  background: #E8B800;
  border-radius: 0 4px 0 0;
  transform: skewY(-45deg);
  transform-origin: top left;
}

/* Helmet top - most visible face */
.iso-helmet-top {
  position: absolute;
  top: -6px;
  left: 6px;
  width: 30px;
  height: 6px;
  background: #FFE666;
  transform: skewX(-45deg);
  transform-origin: bottom left;
  border-radius: 2px 2px 0 0;
}

/* Kangaroo ear bumps */
.iso-helmet-top::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 4px;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 6px solid #FFE666;
}

.iso-helmet-top::after {
  content: '';
  position: absolute;
  top: -4px;
  right: 4px;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 6px solid #FFE666;
}

.iso-helmet-side {
  position: absolute;
  top: 0;
  right: -6px;
  width: 6px;
  height: 18px;
  background: #E8B800;
  transform: skewY(-45deg);
  transform-origin: top left;
  opacity: 0;
}

/* ============================================
   STATE: IDLE - gentle wobble
   ============================================ */
.iso-worker[data-state="idle"] {
  animation: idle-wobble 3s ease-in-out infinite;
}

@keyframes idle-wobble {
  0%, 100% { transform: rotateX(60deg) rotateZ(-45deg); }
  50% { transform: rotateX(60deg) rotateZ(-43deg); }
}

/* ============================================
   STATE: CALLING - tilt forward + headset ring
   ============================================ */
.iso-worker[data-state="calling"] {
  animation: calling-tilt 2.5s ease-in-out infinite;
  transform: rotateX(60deg) rotateZ(-45deg) rotateX(-8deg);
}

@keyframes calling-tilt {
  0%, 100% { transform: rotateX(60deg) rotateZ(-45deg) rotateX(-8deg); }
  50% { transform: rotateX(60deg) rotateZ(-45deg) rotateX(-14deg); }
}

/* Headset ring */
.iso-worker[data-state="calling"] .iso-helmet-front::after {
  content: '';
  position: absolute;
  top: -3px;
  left: 50%;
  transform: translateX(-50%) rotateX(60deg);
  width: 26px;
  height: 26px;
  border: 2.5px solid #333;
  border-radius: 50%;
  border-bottom-color: transparent;
  animation: headset-pulse 1.5s ease-in-out infinite;
}

@keyframes headset-pulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ============================================
   STATE: ALERT - side to side rock + red tint
   ============================================ */
.iso-worker[data-state="alert"] {
  animation: alert-rock 0.8s ease-in-out infinite;
}

.iso-worker[data-state="alert"] .iso-body-front,
.iso-worker[data-state="alert"] .iso-helmet-front {
  filter: brightness(0.85) sepia(0.3) saturate(1.5) hue-rotate(-30deg);
}

@keyframes alert-rock {
  0%, 100% { transform: rotateX(60deg) rotateZ(-40deg); }
  50% { transform: rotateX(60deg) rotateZ(-50deg); }
}

/* Exclamation on top face */
.iso-worker[data-state="alert"] .iso-helmet-top::before {
  content: '!';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%) skewX(45deg);
  width: auto;
  height: auto;
  border: none;
  color: #ff3333;
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}

.iso-worker[data-state="alert"] .iso-helmet-top::after {
  content: '';
  border: none;
}

/* ============================================
   STATE: SUCCESS - Y-axis spin + checkmark
   ============================================ */
.iso-worker[data-state="success"] {
  animation: success-spin 2s ease-in-out infinite;
}

@keyframes success-spin {
  0% { transform: rotateX(60deg) rotateZ(-45deg) rotateY(0deg); }
  40% { transform: rotateX(60deg) rotateZ(-45deg) rotateY(360deg); }
  100% { transform: rotateX(60deg) rotateZ(-45deg) rotateY(360deg); }
}

/* Green checkmark on top face */
.iso-worker[data-state="success"] .iso-helmet-top::before {
  content: '\2713';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%) skewX(45deg);
  width: auto;
  height: auto;
  border: none;
  color: #4CAF50;
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 0 4px rgba(76,175,80,0.4);
}

.iso-worker[data-state="success"] .iso-helmet-top::after {
  content: '';
  border: none;
}

/* Green glow on body */
.iso-worker[data-state="success"] .iso-body-front {
  box-shadow: 0 0 8px rgba(76,175,80,0.3);
}

/* ============================================
   NAV LINK
   ============================================ */
.nav-link {
  margin-top: 48px;
  padding: 8px 20px;
  background: #2f2c25;
  color: #FAF8F2;
  text-decoration: none;
  border-radius: 6px;
  font-size: 13px;
  transition: background 0.2s;
}

.nav-link:hover {
  background: #4a4640;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 700px) {
  .states-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
}
</style>
</head>
<body>

<div class="page-header">
  <h1>等轴测伪 3D</h1>
  <p>CSS transforms 构建的美团骑手立体棋子风格</p>
</div>

<div class="states-grid">

  <!-- IDLE -->
  <div class="state-card">
    <div class="iso-scene">
      <div class="iso-worker" data-state="idle">
        <div class="iso-helmet">
          <div class="iso-helmet-front"></div>
          <div class="iso-helmet-side"></div>
          <div class="iso-helmet-top"></div>
        </div>
        <div class="iso-face"></div>
        <div class="iso-body">
          <div class="iso-body-front">
            <div class="iso-badge"></div>
          </div>
          <div class="iso-body-side"></div>
          <div class="iso-body-top"></div>
        </div>
        <div class="iso-base"></div>
      </div>
    </div>
    <span class="state-label">空闲</span>
    <span class="state-sublabel">idle - 轻微摇摆</span>
  </div>

  <!-- CALLING -->
  <div class="state-card">
    <div class="iso-scene">
      <div class="iso-worker" data-state="calling">
        <div class="iso-helmet">
          <div class="iso-helmet-front"></div>
          <div class="iso-helmet-side"></div>
          <div class="iso-helmet-top"></div>
        </div>
        <div class="iso-face"></div>
        <div class="iso-body">
          <div class="iso-body-front">
            <div class="iso-badge"></div>
          </div>
          <div class="iso-body-side"></div>
          <div class="iso-body-top"></div>
        </div>
        <div class="iso-base"></div>
      </div>
    </div>
    <span class="state-label">通话中</span>
    <span class="state-sublabel">calling - 前倾 + 耳麦</span>
  </div>

  <!-- ALERT -->
  <div class="state-card">
    <div class="iso-scene">
      <div class="iso-worker" data-state="alert">
        <div class="iso-helmet">
          <div class="iso-helmet-front"></div>
          <div class="iso-helmet-side"></div>
          <div class="iso-helmet-top"></div>
        </div>
        <div class="iso-face"></div>
        <div class="iso-body">
          <div class="iso-body-front">
            <div class="iso-badge"></div>
          </div>
          <div class="iso-body-side"></div>
          <div class="iso-body-top"></div>
        </div>
        <div class="iso-base"></div>
      </div>
    </div>
    <span class="state-label">警报</span>
    <span class="state-sublabel">alert - 摇晃 + 红色警示</span>
  </div>

  <!-- SUCCESS -->
  <div class="state-card">
    <div class="iso-scene">
      <div class="iso-worker" data-state="success">
        <div class="iso-helmet">
          <div class="iso-helmet-front"></div>
          <div class="iso-helmet-side"></div>
          <div class="iso-helmet-top"></div>
        </div>
        <div class="iso-face"></div>
        <div class="iso-body">
          <div class="iso-body-front">
            <div class="iso-badge"></div>
          </div>
          <div class="iso-body-side"></div>
          <div class="iso-body-top"></div>
        </div>
        <div class="iso-base"></div>
      </div>
    </div>
    <span class="state-label">完成</span>
    <span class="state-sublabel">success - Y轴旋转 + 勾选</span>
  </div>

</div>

<a class="nav-link" href="worker-showcase-index.html">&larr; 返回总览</a>

</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评测报告 — Executive Dashboard</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f5f5;--surface:#fff;--ink:#1a1a1a;--muted:#888;--border:#e5e5e5;
      --green:#52c41a;--green-bg:#f6ffed;--green-border:#b7eb8f;
      --yellow:#faad14;--yellow-bg:#fffbe6;--yellow-border:#ffe58f;
      --red:#ff4d4f;--red-bg:#fff2f0;--red-border:#ffccc7;
      --blue:#1890ff;--blue-bg:#e6f7ff;
      --radius:8px;--shadow:0 1px 4px rgba(0,0,0,.08);
      --font:Inter,"Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
    html{font-size:14px}
    body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}

    /* ── Header ── */
    .header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .header-left h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
    .header-left p{color:var(--muted);font-size:.85rem;margin-top:2px}
    .header-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:var(--surface)}
    .tag--stop{background:var(--yellow-bg);color:#ad6800;border-color:var(--yellow-border)}
    .tag--config{color:var(--muted)}

    /* ── KPI Row ── */
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px 32px 0}
    .kpi-card{background:var(--surface);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
    .kpi-card:nth-child(1)::before{background:var(--blue)}
    .kpi-card:nth-child(2)::before{background:var(--green)}
    .kpi-card:nth-child(3)::before{background:var(--yellow)}
    .kpi-card:nth-child(4)::before{background:var(--muted)}
    .kpi-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
    .kpi-value{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin:4px 0;line-height:1.1}
    .kpi-sub{font-size:.8rem;color:var(--muted)}
    .kpi-sub strong{color:var(--ink)}

    /* ── Charts Row ── */
    .charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:16px 32px}
    .chart-card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
    .chart-card h3{font-size:1rem;font-weight:700;margin-bottom:16px}

    /* Bar chart */
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative}
    .bar-row:last-child{margin-bottom:0}
    .bar-label{width:220px;flex-shrink:0;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);cursor:default;position:relative}
    .bar-label[title]:hover::after{content:attr(title);position:absolute;left:0;bottom:100%;background:#333;color:#fff;padding:4px 8px;border-radius:4px;font-size:.7rem;white-space:normal;max-width:320px;z-index:5;pointer-events:none}
    .bar-track{flex:1;height:22px;background:#f0f0f0;border-radius:4px;overflow:hidden;position:relative}
    .bar-fill{height:100%;border-radius:4px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
    .bar-fill--green{background:linear-gradient(90deg,#95de64,#52c41a)}
    .bar-fill--yellow{background:linear-gradient(90deg,#ffd666,#faad14)}
    .bar-fill--red{background:linear-gradient(90deg,#ff7875,#ff4d4f)}
    .bar-pct{font-size:.7rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)}
    .bar-counts{width:80px;flex-shrink:0;font-size:.75rem;color:var(--muted);text-align:right}
    .bar-counts span{font-weight:600}
    .bar-counts .c-pass{color:var(--green)}
    .bar-counts .c-fail{color:var(--red)}

    /* Donut */
    .donut-section{display:flex;flex-direction:column;align-items:center;gap:20px}
    .donut-wrap{position:relative;width:160px;height:160px}
    .donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
    .donut-wrap circle{fill:none;stroke-width:14;stroke-linecap:round}
    .donut-bg{stroke:#f0f0f0}
    .donut-fill{stroke:var(--blue);transition:stroke-dashoffset .8s ease}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .donut-center .val{font-size:1.75rem;font-weight:800}
    .donut-center .lbl{font-size:.7rem;color:var(--muted)}
    .stat-list{width:100%;font-size:.85rem}
    .stat-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
    .stat-item:last-child{border-bottom:none}
    .stat-item .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .stat-item .warn{color:var(--red);font-weight:600}

    /* ── Table ── */
    .table-section{padding:0 32px 32px}
    .table-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .table-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .table-header h3{font-size:1rem;font-weight:700}
    .table-filter{display:flex;gap:6px}
    .filter-btn{padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s}
    .filter-btn:hover,.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    table{width:100%;border-collapse:collapse}
    thead th{padding:10px 16px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
    thead th:hover{color:var(--ink)}
    thead th .sort-arrow{margin-left:4px;font-size:.65rem}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
    tbody tr:hover{background:#fafafa}
    tbody td{padding:10px 16px;font-size:.85rem;vertical-align:middle}
    .td-constraint{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    .td-rate{font-weight:700;position:relative}
    .rate-bar{position:absolute;left:0;bottom:0;height:3px;border-radius:2px 2px 0 0}
    .rate-bar--green{background:var(--green)}
    .rate-bar--yellow{background:var(--yellow)}
    .rate-bar--red{background:var(--red)}
    .td-status{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px}
    .status--ok{background:var(--green-bg);color:var(--green)}
    .status--low{background:var(--red-bg);color:var(--red)}
    .td-expand-btn{background:none;border:none;cursor:pointer;color:var(--blue);font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:4px}
    .td-expand-btn:hover{background:var(--blue-bg)}

    /* Expanded row */
    .expand-row{display:none}
    .expand-row.open{display:table-row}
    .expand-row td{padding:0;background:#fafafa}
    .expand-content{padding:16px 24px;border-top:1px dashed var(--border)}
    .expand-content h4{font-size:.85rem;font-weight:700;margin-bottom:12px;color:var(--muted)}
    .seg-list{display:flex;flex-direction:column;gap:12px}
    .seg-item{background:var(--surface);border-radius:6px;padding:12px 16px;border:1px solid var(--border)}
    .seg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.8rem;font-weight:600}
    .seg-result{padding:1px 8px;border-radius:999px;font-size:.7rem;font-weight:700}
    .seg-result--pass{background:var(--green-bg);color:var(--green)}
    .seg-result--fail{background:var(--red-bg);color:var(--red)}
    .seg-result--invalid{background:#f0f0f0;color:var(--muted)}
    .seg-evidence{font-size:.8rem;color:var(--muted);line-height:1.5;margin-bottom:8px;padding-left:12px;border-left:3px solid var(--border)}
    .seg-turns{font-size:.8rem}
    .seg-turn{display:flex;gap:8px;margin-bottom:4px}
    .seg-turn .role{font-weight:600;min-width:36px}
    .seg-turn .role--user{color:var(--blue)}
    .seg-turn .role--agent{color:var(--green)}
    .seg-turn .msg{color:var(--ink)}

    /* ── Footer summary ── */
    .table-footer{padding:12px 16px;background:#fafafa;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}

    /* ── Responsive ── */
    @media(max-width:980px){
      .kpi-row{grid-template-columns:repeat(2,1fr);padding:16px 16px 0}
      .charts-row{grid-template-columns:1fr;padding:12px 16px}
      .table-section{padding:0 16px 16px}
      .header{padding:16px}
      .bar-label{width:140px}
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>评测报告 — Dashboard</h1>
    <p>飞毛腿骑手外呼指令 · V4 主动约束测试</p>
  </div>
  <div class="header-meta">
    <span class="tag tag--stop">⏹ 覆盖停滞退出</span>
    <span class="tag tag--config">目标覆盖 30%</span>
    <span class="tag tag--config">最大 10 轮/组</span>
    <span class="tag tag--config">3 并行</span>
  </div>
</div>

<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-label">覆盖率</div>
    <div class="kpi-value" id="kpi-coverage">--</div>
    <div class="kpi-sub">目标 <strong>--</strong></div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">总通过率</div>
    <div class="kpi-value" id="kpi-passrate">--</div>
    <div class="kpi-sub"><strong>--</strong> / -- 通过</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">约束 / 片段</div>
    <div class="kpi-value" id="kpi-constraints">--</div>
    <div class="kpi-sub">共 <strong>--</strong> 条评估</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">运行耗时</div>
    <div class="kpi-value" id="kpi-time">--</div>
    <div class="kpi-sub"><strong>--</strong> 个对话组</div>
  </div>
</div>

<div class="charts-row">
  <div class="chart-card">
    <h3>各约束通过率</h3>
    <div id="barChart"></div>
  </div>
  <div class="chart-card">
    <h3>覆盖率概览</h3>
    <div class="donut-section">
      <div class="donut-wrap">
        <svg viewBox="0 0 160 160">
          <circle class="donut-bg" cx="80" cy="80" r="66"/>
          <circle class="donut-fill" id="donutFill" cx="80" cy="80" r="66"
            stroke-dasharray="414.69" stroke-dashoffset="414.69"/>
        </svg>
        <div class="donut-center">
          <span class="val" id="donutVal">--</span>
          <span class="lbl">覆盖率</span>
        </div>
      </div>
      <div class="stat-list" id="statList"></div>
    </div>
  </div>
</div>

<div class="table-section">
  <div class="table-card">
    <div class="table-header">
      <h3>评估详情</h3>
      <div class="table-filter">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="risk">⚠ 风险约束</button>
        <button class="filter-btn" data-filter="ok">✓ 达标约束</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th data-sort="constraint">约束 <span class="sort-arrow">↕</span></th>
            <th data-sort="segments">测试数 <span class="sort-arrow">↕</span></th>
            <th data-sort="pass">通过 <span class="sort-arrow">↕</span></th>
            <th data-sort="fail">失败 <span class="sort-arrow">↕</span></th>
            <th data-sort="invalid">无效 <span class="sort-arrow">↕</span></th>
            <th data-sort="rate">通过率 <span class="sort-arrow">↕</span></th>
            <th>状态</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-footer" id="tableFooter"></div>
  </div>
</div>

<script src="mock_data.js"></script>
<script>
(function(){
  const R = MOCK_REPORT;
  const fmt = pct => (pct * 100).toFixed(1) + '%';
  const fmtTime = s => { const m = Math.round(s / 60); return m >= 60 ? (m/60).toFixed(1)+'h' : m+'min'; };
  const rateColor = r => r >= 0.8 ? 'green' : r >= 0.5 ? 'yellow' : 'red';
  const shortText = (t, n=32) => t.length > n ? t.slice(0, n) + '…' : t;

  /* ── KPI Cards ── */
  document.getElementById('kpi-coverage').textContent = fmt(R.coverage);
  document.querySelector('#kpi-coverage + .kpi-sub').innerHTML = '目标 <strong>'+fmt(R.target_coverage)+'</strong>';
  document.getElementById('kpi-passrate').textContent = fmt(R.overall_score.overall_pass_rate);
  document.querySelector('#kpi-passrate + .kpi-sub').innerHTML =
    '<strong>'+Math.round(R.overall_score.overall_pass_rate * R.overall_score.total_evaluations)+'</strong> / '+R.overall_score.total_evaluations+' 通过';
  document.getElementById('kpi-constraints').textContent = R.overall_score.total_constraints_tested + ' / ' + R.overall_score.total_segments;
  document.querySelector('#kpi-constraints + .kpi-sub').innerHTML = '共 <strong>'+R.overall_score.total_evaluations+'</strong> 条评估';
  document.getElementById('kpi-time').textContent = fmtTime(R.elapsed_seconds);
  document.querySelector('#kpi-time + .kpi-sub').innerHTML = '<strong>'+R.conversation_groups.length+'</strong> 个对话组';

  /* ── Bar Chart ── */
  const summaries = R.overall_score.constraint_eval_summaries;
  const barDiv = document.getElementById('barChart');
  summaries.forEach(s => {
    const color = rateColor(s.pass_rate);
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<span class="bar-label" title="'+s.constraint_text+'">'+shortText(s.constraint_text, 28)+'</span>'+
      '<div class="bar-track"><div class="bar-fill bar-fill--'+color+'" style="width:'+Math.max(s.pass_rate*100,3)+'%"></div></div>'+
      '<span class="bar-counts"><span class="c-pass">'+s.pass_count+'</span> / <span class="c-fail">'+s.fail_count+'</span></span>'+
      '<span style="width:48px;text-align:right;font-weight:700;font-size:.8rem">'+fmt(s.pass_rate)+'</span>';
    barDiv.appendChild(row);
  });

  /* ── Donut ── */
  const circumference = 2 * Math.PI * 66;
  const offset = circumference * (1 - R.coverage);
  const fill = document.getElementById('donutFill');
  setTimeout(() => { fill.style.strokeDashoffset = offset; }, 100);
  document.getElementById('donutVal').textContent = fmt(R.coverage);

  /* ── Stat List ── */
  const stats = R.constraint_stats;
  const tested = stats.filter(s => s.sufficiently_tested).length;
  const untested = stats.filter(s => !s.sufficiently_tested).length;
  const listDiv = document.getElementById('statList');
  listDiv.innerHTML =
    '<div class="stat-item"><span><span class="dot" style="background:var(--green)"></span>充分测试约束</span><strong>'+tested+'</strong></div>'+
    '<div class="stat-item"><span><span class="dot" style="background:var(--red)"></span>未充分测试约束</span><strong class="warn">'+untested+'</strong></div>'+
    (untested > 0 ? stats.filter(s=>!s.sufficiently_tested).map(s =>
      '<div class="stat-item" style="padding-left:18px;font-size:.8rem;color:var(--red)">⚠ '+shortText(s.constraint_text, 30)+'</div>'
    ).join('') : '');

  /* ── Table ── */
  const tbody = document.getElementById('tableBody');
  let currentFilter = 'all';

  function renderTable(filter) {
    tbody.innerHTML = '';
    let filtered = summaries;
    if (filter === 'risk') filtered = summaries.filter(s => s.pass_rate < 0.8);
    if (filter === 'ok') filtered = summaries.filter(s => s.pass_rate >= 0.8);

    filtered.forEach((s, idx) => {
      const color = rateColor(s.pass_rate);
      const statusClass = s.pass_rate >= 0.8 ? 'status--ok' : 'status--low';
      const statusText = s.pass_rate >= 0.8 ? '✓ 达标' : '⚠ 需关注';

      // Find matching evaluations
      const evals = R.evaluations.filter(e => e.constraint_text === s.constraint_text);

      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="td-constraint" title="'+s.constraint_text+'">'+s.constraint_text+'</td>'+
        '<td>'+s.total_segments+'</td>'+
        '<td style="color:var(--green);font-weight:600">'+s.pass_count+'</td>'+
        '<td style="color:var(--red);font-weight:600">'+s.fail_count+'</td>'+
        '<td style="color:var(--muted)">'+s.invalid_count+'</td>'+
        '<td class="td-rate">'+fmt(s.pass_rate)+
          '<div class="rate-bar rate-bar--'+color+'" style="width:'+s.pass_rate*100+'%"></div></td>'+
        '<td><span class="td-status '+statusClass+'">'+statusText+'</span></td>'+
        '<td><button class="td-expand-btn" data-idx="'+idx+'">展开 ▾</button></td>';
      tbody.appendChild(tr);

      // Expand row
      const expandTr = document.createElement('tr');
      expandTr.className = 'expand-row';
      expandTr.id = 'expand-'+idx;
      let segHTML = evals.map(e =>
        '<div class="seg-item">'+
          '<div class="seg-head"><span class="seg-result seg-result--'+e.result+'">'+(e.result==='pass'?'通过':'失败')+'</span> Segment #'+e.segment_id+'</div>'+
          '<div class="seg-evidence">'+e.evidence+'</div>'+
          '<div class="seg-turns">'+e.segment_turns.map(t =>
            '<div class="seg-turn"><span class="role role--user">用户:</span><span class="msg">'+t.user_reply+'</span></div>'+
            '<div class="seg-turn"><span class="role role--agent">Agent:</span><span class="msg">'+t.agent_reply+'</span></div>'
          ).join('')+'</div>'+
        '</div>'
      ).join('');
      if(!evals.length) segHTML = '<p style="font-size:.8rem;color:var(--muted);padding:8px 0">暂无评估证据数据</p>';
      expandTr.innerHTML = '<td colspan="8"><div class="expand-content"><h4>测试证据（'+evals.length+' 条评估）</h4><div class="seg-list">'+segHTML+'</div></div></td>';
      tbody.appendChild(expandTr);
    });

    // Bind expand
    tbody.querySelectorAll('.td-expand-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = btn.dataset.idx;
        const row = document.getElementById('expand-'+idx);
        const isOpen = row.classList.contains('open');
        row.classList.toggle('open');
        btn.textContent = isOpen ? '展开 ▾' : '收起 ▴';
      });
    });
  }

  renderTable('all');

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable(btn.dataset.filter);
    });
  });

  // Footer
  const totalPass = summaries.reduce((a,s) => a+s.pass_count, 0);
  const totalFail = summaries.reduce((a,s) => a+s.fail_count, 0);
  const totalInv  = summaries.reduce((a,s) => a+s.invalid_count, 0);
  document.getElementById('tableFooter').innerHTML =
    '<span>共 '+summaries.length+' 条约束</span>'+
    '<span>总计 '+totalPass+' 通过 / '+totalFail+' 失败 / '+totalInv+' 无效</span>';
})();
</script>
</body>
</html>
